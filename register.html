<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Allergen Audit</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <header>
      <h1>Allergen Audit</h1>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="lookup.html">Lookup</a></li>
        </ul>
      </nav>

      <hr />
    </header>

    <main>
      <h2>Create Your Account</h2>

      <!-- Authentication placeholder -->
      <form method="post" action="dashboard.html">
        <div>
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" name="vFullName" placeholder="Your name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="vEmail" placeholder="your@email.com" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="vPassword" placeholder="password" required />
        </div>
        <button type="submit">Create Account</button>
      </form>

      <p>Already have an account? <a href="index.html">Log in</a>.</p>
    </main>

    <footer>
      <hr />
      <span>Natasha Burkart</span>
      <br />
      <a href="https://github.com/nb553/startup">GitHub</a>
    </footer>
  </body>
</html>
