<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Allergen Audit</title>
    <link rel="icon" href="favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="min-h-screen flex flex-col">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 p-4 md:px-8 bg-[var(--navy)] border-b-4 border-[var(--teal)]">
      <h1 class="text-2xl md:text-3xl text-white italic">Allergen Audit</h1>
      <nav>
        <ul class="flex flex-wrap gap-4 list-none p-0 m-0">
          <li><a href="index.html">Home</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="lookup.html">Lookup</a></li>
        </ul>
      </nav>
    </header>

    <main class="flex-1 max-w-2xl mx-auto w-full p-4 md:p-8 flex flex-col gap-6">
      <h2 class="text-xl md:text-2xl">Create Your Account</h2>

      <!-- Authentication placeholder -->
      <form method="post" action="dashboard.html" class="card flex flex-col gap-3 max-w-sm">
        <div class="flex flex-col gap-1">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" name="vFullName" placeholder="Your name" required class="form-input" />
        </div>
        <div class="flex flex-col gap-1">
          <label for="email">Email</label>
          <input type="email" id="email" name="vEmail" placeholder="your@email.com" required class="form-input" />
        </div>
        <div class="flex flex-col gap-1">
          <label for="password">Password</label>
          <input type="password" id="password" name="vPassword" placeholder="password" required class="form-input" />
        </div>
        <button type="submit" class="btn-primary self-start">Create Account</button>
      </form>

      <p>Already have an account? <a href="index.html" class="btn-secondary">Log in</a></p>
    </main>

    <footer class="p-4 bg-[var(--navy)] border-t-4 border-[var(--teal)] text-center text-white">
      <span>Natasha Burkart</span>
      <br />
      <a href="https://github.com/nb553/startup" class="text-[var(--teal)] underline">GitHub</a>
    </footer>
  </body>
</html>
